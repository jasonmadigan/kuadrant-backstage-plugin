apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
  labels:
    app.kubernetes.io/part-of: kuadrant-rhdh-release-test
spec:
  application:
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: rhdh-app-config
        # written by make remote-setup; listed last so it merges last
        - name: kuadrant-e2e-app-config
    extraFiles:
      mountPath: /opt/app-root/etc
      configMaps:
        - name: kuadrant-e2e-files
  deployment:
    patch:
      spec:
        template:
          spec:
            # the plugin backend uses in-cluster credentials
            automountServiceAccountToken: true
